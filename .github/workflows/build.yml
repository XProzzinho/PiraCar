name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Gerar projeto Android
        run: |
          mkdir /tmp/bak && cp -r lib pubspec.yaml /tmp/bak/
          flutter create --platforms=android --org com.piracar --project-name piracar_passageiro .
          rm -rf lib pubspec.yaml
          cp -r /tmp/bak/lib /tmp/bak/pubspec.yaml .

      - name: Configurar Android (Maps, Firebase)
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cp google-services.json android/app/google-services.json
          python3 tool/patch_android.py "$MAPS_KEY"

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: piracar-passageiro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
