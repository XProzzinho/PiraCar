name: piracar_passageiro
description: PiraCar - app do passageiro
publish_to: none
version: 1.0.2+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  url_launcher: ^6.3.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  http: ^1.2.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.4

dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/veiculos/
    - assets/legal/
