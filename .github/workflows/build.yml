name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Certificado fixo de assinatura
        env:
          KEYSTORE: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Assina sempre com o mesmo certificado, para o SHA-1 cadastrado
          # no Firebase (login com Google) valer em todos os builds.
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 não configurado; o APK sai com um certificado temporário."
            exit 0
          fi
          mkdir -p ~/.android
          LIMPO=$(printf '%s' "$KEYSTORE" | tr -d ' \n\r\t')
          echo "Tamanho do segredo: ${#LIMPO} caracteres (o certo é 3556)"
          if ! printf '%s' "$LIMPO" | base64 -d > ~/.android/debug.keystore 2>/dev/null \
             || ! keytool -list -keystore ~/.android/debug.keystore -storepass android >/dev/null 2>&1; then
            echo "::error::O secret DEBUG_KEYSTORE_BASE64 está incompleto ou com erro: tem ${#LIMPO} caracteres, o certo é 3556. Apague e cole de novo o texto inteiro do arquivo."
            exit 1
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1:|SHA256:" | sed 's/^[[:space:]]*/::notice::Chave fixa OK - /' || true

      - name: Gerar projeto Android
        run: |
          mkdir /tmp/bak && cp -r lib pubspec.yaml /tmp/bak/
          flutter create --platforms=android --org com.piracar --project-name piracar_passageiro .
          rm -rf lib pubspec.yaml
          cp -r /tmp/bak/lib /tmp/bak/pubspec.yaml .

      - name: Gerar ícones e logo
        run: |
          pip install pillow
          python3 tool/icone.py

      - name: Configurar Android (Maps, Firebase)
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          cp google-services.json android/app/google-services.json
          python3 tool/patch_android.py "$MAPS_KEY"

      - run: flutter pub get

      - name: Conferir código
        run: flutter analyze --no-pub lib 2>&1 | grep -E "^\s*error" | sed 's/^\s*/::error::/' || true

      - name: Compilar APK
        env:
          MAPS_KEY: ${{ secrets.MAPS_API_KEY }}
        run: flutter build apk --release --dart-define=MAPS_KEY="$MAPS_KEY"

      - name: Mostrar SHA do certificado
        run: |
          if [ -f ~/.android/debug.keystore ]; then
            keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA1:|SHA256:" | sed 's/^[[:space:]]*/::notice::/' || true
          else
            echo "::warning::Sem chave fixa. Configure o secret DEBUG_KEYSTORE_BASE64."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: piracar-passageiro-apk
          path: build/app/outputs/flutter-apk/app-release.apk
